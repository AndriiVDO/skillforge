
  unit-tests:
    name: API — unit and endpoint tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test backend/SkillForge.Api.Tests --configuration Release
