name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npx eslint .

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend — build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/SkillForge.Api/SkillForge.Api.csproj

      - name: Build backend
        run: dotnet build backend/SkillForge.Api/SkillForge.Api.csproj --configuration Release --no-restore

  database:
    name: API — PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: skillforge_test
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillforge -d skillforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__SkillForge: "Host=localhost;Port=5432;Database=skillforge_test;Username=skillforge;Password=ci_test_password"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build API
        run: dotnet build backend/SkillForge.Api --configuration Release

      - name: Apply database migrations
        run: dotnet ef database update --project backend/SkillForge.Api --configuration Release --no-build

      - name: Check API against PostgreSQL
        shell: bash
        run: |
          dotnet run \
            --project backend/SkillForge.Api \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            --urls http://127.0.0.1:5050 > api.log 2>&1 &

          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          python3 scripts/check_api.py

      - name: Check topic creation and task persistence
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development \
            dotnet backend/SkillForge.Api/bin/Release/net10.0/SkillForge.Api.dll \
            --urls http://127.0.0.1:5051 > api-writes.log 2>&1 &

          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          python3 scripts/check_topic_writes.py

      - name: Show API logs on failure
        if: failure()
        run: |
          if [ -f api.log ]; then
            cat api.log
          fi

          if [ -f api-writes.log ]; then
            cat api-writes.log
          fi

  docker:
    name: Docker — build and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create temporary database configuration
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci_docker_password' > .env.database

      - name: Build and start stack
        run: docker compose --env-file .env.database up -d --build

      - name: Check API and frontend
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 120 --connect-timeout 3 --max-time 10 \
            --output /tmp/db-health.json \
            http://127.0.0.1:5050/api/health/db

          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 120 --connect-timeout 3 --max-time 10 \
            --output /tmp/topics.json \
            http://127.0.0.1:5050/api/topics

          python3 - <<'PY'
          import json

          with open("/tmp/db-health.json") as file:
              health = json.load(file)

          assert health["status"] == "ok", "Database health check failed."

          with open("/tmp/topics.json") as file:
              topics = json.load(file)

          assert len(topics) == 5, "Expected five seeded topics."
          assert sum(len(t["lessons"]) for t in topics) == 16
          assert sum(len(t["resources"]) for t in topics) == 11

          print("PASS: containerized API returns seeded learning content.")
          PY

          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 120 --connect-timeout 3 --max-time 20 \
            --output /tmp/topics.html \
            http://127.0.0.1:3000/topics

          python3 - <<'PY'
          from html.parser import HTMLParser

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = set()

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.links.update(
                          value for key, value in attrs
                          if key == "href"
                      )

          parser = PageParser()

          with open("/tmp/topics.html") as file:
              parser.feed(file.read())

          assert "/topics/linux" in parser.links, \
              "The frontend did not render the API-backed topic catalog."

          print("PASS: containerized frontend renders learning topics.")
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.database logs --no-color --tail=150

      - name: Clean up temporary stack
        if: always()
        run: docker compose --env-file .env.database down -v
